version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Senha@123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/lib/mssql/data

  backend:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__Default=Server=sqlserver;Database=GerenciadorDevDb;User Id=sa;Password=Senha@123;TrustServerCertificate=True;
      - Jwt__Key=chave-secreta-minimo-32-caracteres-aqui
      - Jwt__Issuer=GerenciadorDev
      - Jwt__Audience=GerenciadorDev
      - Jwt__ExpiresInHours=8
    depends_on:
      - sqlserver

volumes:
  sqldata: